name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Server tests
        run: npm test --prefix server

      - name: Client lint and build
        run: |
          npm run lint --prefix client
          npm run build --prefix client

  e2e:
    runs-on: ubuntu-latest
    needs: server-and-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix e2e

      - name: Install the browser
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test --prefix e2e

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
